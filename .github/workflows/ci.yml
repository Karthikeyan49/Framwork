name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: make setup
      - run: make check
      - run: make infra-up migrate migration-status
      - run: make test
      - run: make test-rules-fuzz
      - run: make test-events-fuzz
      - run: make test-workflows-fuzz
      - run: make build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/cache/ms-playwright
      - run: make test-e2e
      - name: Collector readiness
        run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:13133/
      - name: Dependency audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Clean up
        if: always()
        run: docker compose --env-file .env -f infra/compose/compose.yaml down
