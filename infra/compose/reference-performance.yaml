# Explicit ADR058 reference profile v2; bounded acceptance recorded in its ADR.
# Normal infra-up keeps lightweight defaults.
# Recreating this owned local container retains the named pgdata volume.
services:
  postgres:
    cpus: 4
    mem_limit: 8g
    memswap_limit: 8g
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=4MB
      - -c
      - random_page_cost=1.1
