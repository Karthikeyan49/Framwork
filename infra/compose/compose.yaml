name: framework-m0
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: framework
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env first}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?run make env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run make env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d framework"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2.3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make env first}
    command:
      - /bin/sh
      - -ec
      - 'umask 077; cp /run/framework/users.acl /tmp/users.acl; printf "bind 0.0.0.0\nprotected-mode yes\naclfile /tmp/users.acl\nappendonly no\nsave \"\"\ndbfilename framework-cache.rdb\n" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    volumes: ["../../.local/m8/users.acl:/run/framework/users.acl:ro"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    restart: unless-stopped
volumes:
  pgdata:
